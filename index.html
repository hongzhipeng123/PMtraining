<meta charset="UTF-8">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #06061a; --bg-alt: #0c0c28; --surface: #12123a; --surface-hover: #1a1a50;
  --card: #16164a; --border: #2a2a6e; --border-hover: #3d3d8e;
  --purple-300: #c4b5fd; --purple-400: #a78bfa; --purple-500: #8b5cf6;
  --purple-600: #7c3aed; --purple-700: #6d28d9; --purple-800: #5b21b6;
  --cyan-400: #22d3ee; --cyan-500: #06b6d4;
  --text: #e2e8f0; --text-sec: #94a3b8; --text-muted: #64748b;
  --success: #10b981; --warning: #f59e0b; --error: #ef4444;
  --glow: 0 0 24px rgba(139,92,246,0.35); --glow-sm: 0 0 12px rgba(139,92,246,0.25);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}
html, body, #root { height: 100%; width: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--purple-500); }
input, textarea, select, button { font-family: inherit; }

@keyframes floatOrb { 0%,100%{ transform: translate(0,0) scale(1); } 33%{ transform: translate(30px,-50px) scale(1.1); } 66%{ transform: translate(-20px,40px) scale(0.9); } }
@keyframes fadeIn { from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
@keyframes fadeInScale { from{ opacity:0; transform:scale(0.95); } to{ opacity:1; transform:scale(1); } }
@keyframes slideInLeft { from{ opacity:0; transform:translateX(-20px); } to{ opacity:1; transform:translateX(0); } }
@keyframes slideInRight { from{ opacity:0; transform:translateX(20px); } to{ opacity:1; transform:translateX(0); } }
@keyframes slideInUp { from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
@keyframes cursorBlink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
@keyframes spin { to{ transform:rotate(360deg); } }
@keyframes nodeExpand { from{ opacity:0; transform:scale(0.5); } to{ opacity:1; transform:scale(1); } }
@keyframes glowPulse { 0%,100%{ filter: drop-shadow(0 0 6px rgba(139,92,246,0.4)); } 50%{ filter: drop-shadow(0 0 16px rgba(139,92,246,0.7)); } }

.login-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: floatOrb 12s ease-in-out infinite; }
.page-enter { animation: fadeIn 0.35s ease-out both; }
.anim-fade-in-scale { animation: fadeInScale 0.5s ease-out both; }
.anim-fade-in { animation: fadeIn 0.3s ease-out both; }
.anim-slide-right { animation: slideInRight 0.3s ease-out both; }

@keyframes slideUpSheet { from{ opacity:0; transform:translateY(40px); } to{ opacity:1; transform:translateY(0); } }
.anim-slide-up-sheet { animation: slideUpSheet 0.3s cubic-bezier(0.4,0,0.2,1) both; }

[data-tooltip] { position: relative; }
[data-tooltip]:hover::after {
  content: attr(data-tooltip); position: absolute; left: 110%; top: 50%; transform: translateY(-50%);
  background: var(--surface); color: var(--text); padding: 4px 10px; border-radius: 6px;
  font-size: 12px; white-space: nowrap; z-index: 1000; border: 1px solid var(--border);
  box-shadow: var(--glow-sm); pointer-events: none;
}

/* ── Mobile (≤768px) ── */
@media (max-width: 768px) {
  /* Allow the app shell to manage its own scroll; release the hard viewport lock */
  html, body { overflow: visible; height: 100%; }
  #root { height: 100%; }
  /* Prevent iOS auto-zoom on focus: inputs must be ≥16px */
  input, textarea, select { font-size: 16px !important; }
  /* Disable tooltips (no hover on touch) */
  [data-tooltip]:hover::after { display: none; }
  /* Toast: top-center, edge-to-edge */
  .toast-stack { top: calc(12px + env(safe-area-inset-top)) !important; right: 12px !important; left: 12px !important; align-items: stretch; }
  /* Momentum scrolling for inner scroll regions */
  * { -webkit-overflow-scrolling: touch; }
  /* Slimmer scrollbars feel out of place on mobile; hide track */
  ::-webkit-scrollbar { width: 0; height: 0; }
}
* { -webkit-tap-highlight-color: transparent; }
</style>
</head>

<div id="root"></div>

<!-- Core UI -->
<script type="text/babel" src="components/ui.jsx"></script>

<!-- Pages -->
<script type="text/babel" src="components/login.jsx"></script>
<script type="text/babel" src="components/reverse-ai.jsx"></script>
<script type="text/babel" src="components/knowledge.jsx"></script>
<script type="text/babel" src="components/tools.jsx"></script>
<script type="text/babel" src="components/growth.jsx"></script>
<script type="text/babel" src="components/report.jsx"></script>
<script type="text/babel" src="components/search-palette.jsx"></script>

<!-- App shell -->
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
